name: Feature Request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What's the problem this solves?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      placeholder: What do you want to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative
      placeholder: Other ideas you considered?
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I can open a PR for this
