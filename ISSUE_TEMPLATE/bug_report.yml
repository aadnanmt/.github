name: Bug Report
description: Something is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: I did X but got Y instead of Z
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Do this
        2. Then that
        3. Error appears
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Arch Linux, Node 24, package v1.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error logs
      render: shell
